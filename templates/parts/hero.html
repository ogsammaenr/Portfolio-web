<header class="hero star-hero" id="hero">
    
    <div class="hero-bg-layer">
        <div class="hero-glow-bg"></div> 
        <div id="stars-container">
            <div id="stars1" class="star-layer"></div>
            <div id="stars2" class="star-layer"></div>
            <div id="stars3" class="star-layer"></div>
        </div>
    </div>

    <div class="hero-content-wrapper reveal">
        <div class="status-badge">
            <span class="pulse-dot"></span> System Online

        <h2 class="typewriter-text">> <span id="typewriter"></span><span class="cursor">_</span></h2>
        
        <p class="hero-desc">
            Minimalist sistemler inşa eden, donanım dostu ve "bloat-free" mimariler tasarlayan yazılım mühendisliği öğrencisi.
        </p>
        
        <div class="hero-actions">
            <a href="#projects" class="btn primary-btn">Projeleri İncele <span>{% include "icons/arrow.html" ignore missing %}</span></a>
            <a href="#contact" class="btn secondary-btn">İletişim</a>
        </div>
    </div>

</header>
